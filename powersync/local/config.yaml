# Self-hosted PowerSync for the local playground (scripts/local-db.sh). Runs in Docker on
# the local Supabase stack's network and uses the SAME sync config as production
# (../sync-config.yaml), so local sync can't drift from the live rules.
replication:
  connections:
    - type: postgresql
      uri: postgresql://postgres:postgres@supabase_db_roznamcha:5432/postgres
      sslmode: disable

# PowerSync's own bucket storage, in a separate database on the same local server.
storage:
  type: postgresql
  uri: postgresql://postgres:postgres@supabase_db_roznamcha:5432/powersync_storage
  sslmode: disable

port: 8080

sync_config:
  path: /config/sync-config.yaml

# Local Supabase signs logins with ES256; verify against its published keys.
client_auth:
  jwks_uri: http://supabase_kong_roznamcha:8000/auth/v1/.well-known/jwks.json
  # The key server is on Docker's private network, which is blocked by default.
  block_local_jwks: false
  audience: ['authenticated']

telemetry:
  disable_telemetry_sharing: true
